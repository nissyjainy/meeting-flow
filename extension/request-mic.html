<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MeetFlow — Microphone access</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: system-ui, -apple-system, Segoe UI, sans-serif;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0f1115;
        color: #e8eaed;
      }
      .card {
        width: min(420px, 92vw);
        padding: 24px;
        border-radius: 12px;
        background: #1a1d23;
        border: 1px solid #2d3139;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 18px;
      }
      p {
        margin: 0 0 12px;
        line-height: 1.5;
        color: #bdc1c6;
        font-size: 14px;
      }
      button {
        width: 100%;
        border: none;
        border-radius: 8px;
        padding: 10px 12px;
        font-weight: 600;
        cursor: pointer;
        background: #1a73e8;
        color: #fff;
      }
      button:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }
      .error {
        color: #f28b82;
        font-size: 13px;
      }
      .success {
        color: #81c995;
        font-size: 13px;
      }
      .hidden {
        display: none;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Allow microphone</h1>
      <p id="status-text">
        MeetFlow needs your microphone to record your voice during meeting capture. Click below
        and choose <strong>Allow</strong> in the Chrome prompt.
      </p>
      <p id="error-text" class="error hidden"></p>
      <p id="success-text" class="success hidden"></p>
      <button id="allow-btn" type="button">Allow microphone</button>
    </div>
    <script src="storage.js"></script>
    <script src="mic-permission.js"></script>
    <script src="request-mic.js"></script>
  </body>
</html>
